[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "trust-me-bro-benchmark"
version = "0.1.0"
description = "Reproducible behavioral comparisons of model APIs. Trust but verify."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.28,<1", "numpy>=2,<3", "pydantic>=2.10,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
datasets = ["pyarrow>=18,<25"]
mcp = [
    "mcp>=2.2,<3",
]

[project.scripts]
tmb = "tmb.cli:main"
tmb-mcp = "tmb.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tmb"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[project.urls]
Repository = "https://github.com/NetraRuntime/trust-me-bro-benchmark"
Issues = "https://github.com/NetraRuntime/trust-me-bro-benchmark/issues"
